
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: personal-agent-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_password
      POSTGRES_DB: personal_agent

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d personal_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
